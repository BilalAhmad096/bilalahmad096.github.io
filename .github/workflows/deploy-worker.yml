# Deploys the Cloudflare Worker (worker/), which serves Ask Mintorian and the
# Market Explorer's live prices, when its code changes on main, or by hand
# from the Actions tab.
#
# It needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN  a Cloudflare API token from the "Edit Cloudflare
#                         Workers" template, for this account only.
#   FINNHUB_API_KEY       optional; when present it is stored as the Worker's
#                         secret of the same name on every deploy.
# Without the token the job says so and stops, so it is safe to have before
# the secrets exist. Secrets already on the Worker (OPENAI_API_KEY and the
# rest) are left as they are.

name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
    steps:
      - name: Check for the Cloudflare token
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set, so nothing is deployed."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: "20"

      - name: Install
        if: steps.token.outputs.present == 'true'
        run: npm ci

      # Nothing reaches production that fails the site's own checks.
      - name: Test
        if: steps.token.outputs.present == 'true'
        run: |
          npm run check
          npm test

      - name: Store the Finnhub key on the Worker
        if: steps.token.outputs.present == 'true' && env.FINNHUB_API_KEY != ''
        run: printf '%s' "$FINNHUB_API_KEY" | npx wrangler secret put FINNHUB_API_KEY --config worker/wrangler.jsonc

      - name: Deploy
        if: steps.token.outputs.present == 'true'
        run: npm run deploy:api
