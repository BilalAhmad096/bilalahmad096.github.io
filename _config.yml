# GitHub Pages builds this repository with Jekyll. The site itself is plain
# static HTML, CSS, JS and the JSON under data/; nothing here uses Jekyll
# templating. This file exists only to keep the development side of the repo
# (the Cloudflare worker, build scripts, tests and npm metadata) from being
# published alongside the site.
#
# On the Jekyll version GitHub Pages runs, a custom exclude list replaces the
# default one rather than extending it, so node_modules is listed again here.
exclude:
  - worker/
  - scripts/
  - tests/
  - package.json
  - package-lock.json
  - node_modules/
  - README.md
